<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Date</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#f3f7fd; --panel:#ffffff; --ink:#0f2a4a; --muted:#5a6f8c; --line:#d6e2f2;
  --head:#1f6fd1; --head-ink:#ffffff; --accent:#1f6fd1; --accent-ink:#ffffff;
  --warn:#a34b1f; --drop:#eaf2fd; --chk:#fff27a; --chk-ink:#1d1d1b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1a2e; --panel:#11243d; --ink:#e6eef9; --muted:#9db0c9; --line:#26405f;
    --head:#1f4f8f; --head-ink:#f0f6ff; --accent:#5b9cf0; --accent-ink:#0b1a2e;
    --warn:#f0a07a; --drop:#0f2138; --chk:#5e5414; --chk-ink:#fff7c2;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1a2e; --panel:#11243d; --ink:#e6eef9; --muted:#9db0c9; --line:#26405f;
  --head:#1f4f8f; --head-ink:#f0f6ff; --accent:#5b9cf0; --accent-ink:#0b1a2e;
  --warn:#f0a07a; --drop:#0f2138; --chk:#5e5414; --chk-ink:#fff7c2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 22px}
h2{font-size:15px;margin:28px 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
#drop{border:2px dashed var(--line);background:var(--drop);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s}
#drop.over{border-color:var(--accent)}
#drop b{display:block;font-size:15px;margin-bottom:4px}
#drop span{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.bar .grow{flex:1}
button{font:inherit;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.files{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.files li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.warn{color:var(--warn)}
#result:empty::before{content:"아직 결과가 없습니다.";color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;max-width:900px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--head);color:var(--head-ink)}
tr.chk td{background:var(--chk);color:var(--chk-ink);font-weight:600}
td.nt{text-align:left;white-space:normal;font-weight:400}
.home{display:flex;justify-content:center;margin-top:36px}
.home a{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:10px 28px;border-radius:8px}
.home a:hover{filter:brightness(.9)}
.home a:focus-visible{outline:3px solid var(--line);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Test Date</h1>
  <p class="sub">여러 SAR 엑셀의 System Check Date를 모아 날짜 · 시스템 대역 · SAR Lab. 표로 정리합니다.</p>

  <section class="panel">
    <div id="drop" tabindex="0">
      <b>엑셀 파일을 여기에 끌어다 놓으세요</b>
      <span>또는 클릭해서 선택 (.xlsx, .xlsm)</span>
      <input id="file" type="file" accept=".xlsx,.xlsm" multiple hidden>
    </div>
    <ul class="files" id="files"></ul>
    <div class="bar">
      <span class="grow" id="msg"></span>
      <button id="clear" disabled>초기화</button>
      <button id="run" class="primary" disabled>실행</button>
    </div>
  </section>

  <h2>결과</h2>
  <section class="panel" id="result"></section>
  <!-- 페이지 맨 끝: 대시보드로 돌아가기 -->
  <nav class="home"><a href="../dashboard/index.html">홈 화면</a></nav>
</main>

<script>
const $ = id => document.getElementById(id);
const state = { files: [] };

function render(){
  $('files').innerHTML = state.files.map(f => `<li>${f.name}</li>`).join('');
  $('run').disabled = $('clear').disabled = state.files.length === 0;
}

function addFiles(list){
  for (const f of list){
    if (!/\.(xlsx|xlsm)$/i.test(f.name)){
      $('msg').innerHTML = `<span class="warn">.xlsx/.xlsm 파일만 읽을 수 있어요: ${f.name}</span>`;
      continue;
    }
    if (!state.files.some(x => x.name === f.name)) state.files.push(f);
  }
  render();
}

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
$('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('clear').addEventListener('click', () => { state.files = []; $('msg').textContent = ''; $('result').innerHTML = ''; render(); });

// ── 규칙 ───────────────────────────────────────────────
const BANDS = [13.5, 750, 835, 1750, 1900, 2300, 2450, 2600, 3500, 3700, 3900, 5250, 5600, 5750, 5800, 6000, 8000];
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim().toLowerCase();
const H_DATE = 'system check date', H_FREQ = 'frequency (mhz)', H_LAB = 'sar lab.';

// 측정 주파수와 가장 가까운 시스템 대역 목록.
// 두 대역의 정확히 가운데(예: 5775 → 5750, 5800)면 두 시스템이 모두 필요하므로 둘 다 반환.
function toBands(f){
  const s = BANDS.map(b => ({ b, d: Math.abs(b - f) })).sort((x, y) => x.d - y.d || x.b - y.b);
  return Math.abs(s[0].d - s[1].d) < 1e-9 ? [s[0].b, s[1].b] : [s[0].b];
}
// 3000대역(3500/3700/3900) 시스템이 걸린 중간 주파수는 실제로 쓰지 않는 값이라 결과에 표시해 확인하게 한다.
// 숫자 표시는 모두 소수점 둘째 자리까지 (예: 13.50, 2450.00)
const fmt2 = n => Number(n).toFixed(2);
// 13.5 대역은 주파수 숫자 대신 다이폴 이름 CLA-13으로 표시된다.
const isCLA13 = s => /CLA\s*-?\s*13(?!\d)/i.test(String(s));
const is3G = b => b >= 3000 && b < 4000;
const needsCheck = bands => bands.length === 2 && bands.some(is3G);

// ExcelJS 셀 값 → 원시 값 (수식 결과, 서식 텍스트 처리)
function raw(v){
  if (v && typeof v === 'object' && !(v instanceof Date)){
    if ('result' in v) return raw(v.result);
    if (Array.isArray(v.richText)) return v.richText.map(t => t.text).join('');
    if ('text' in v) return v.text;
    return null;
  }
  return v;
}
const pad = n => String(n).padStart(2, '0');
function toDate(v){
  v = raw(v);
  // 날짜 서식이 걸린 0(빈 수식 결과)은 1899-12-30으로 읽히므로 제외
  if (v instanceof Date && !isNaN(v) && v.getUTCFullYear() > 1900) return `${v.getUTCFullYear()}-${pad(v.getUTCMonth() + 1)}-${pad(v.getUTCDate())}`;
  if (typeof v === 'string'){
    const m = v.trim().match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  }
  return null;
}
function toFreq(v){
  v = raw(v);
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/,/g, ''));
  return isFinite(n) && n > 0 ? n : null;
}

// 한 시트에서 (날짜, 대역, SAR Lab.) 추출. 헤더 행 아래 ~ 다음 헤더 행 전까지가 한 표.
function scanSheet(ws, out){
  let cols = null;
  ws.eachRow({ includeEmpty: false }, row => {
    let dateCol = 0, freqCol = 0, labCol = 0, dipoleCol = 0;
    row.eachCell(c => {
      const t = norm(raw(c.value));
      if (t === H_DATE) dateCol = c.col;
      else if (t === H_FREQ) freqCol = c.col;
      else if (t === H_LAB) labCol = c.col;
      else if (t.includes('dipole')) dipoleCol = c.col;
    });
    if (dateCol){ cols = (freqCol || dipoleCol) ? { dateCol, freqCol, labCol, dipoleCol } : null; return; }
    if (!cols) return;
    const date = toDate(row.getCell(cols.dateCol).value);
    if (!date) return;
    const cellText = col => col ? String(raw(row.getCell(col).value) ?? '') : '';
    const lab = cellText(cols.labCol).trim();
    let bands;
    if (isCLA13(cellText(cols.dipoleCol)) || isCLA13(cellText(cols.freqCol))){
      bands = [13.5];                               // CLA-13 = 13.5 대역 (주파수 숫자와 무관)
    } else {
      const freq = cols.freqCol ? toFreq(row.getCell(cols.freqCol).value) : null;
      if (freq == null) return;                     // 주파수 없는 행은 제외
      bands = toBands(freq);
    }
    const freq = bands.length === 2 ? toFreq(row.getCell(cols.freqCol).value) : null;
    const flag = needsCheck(bands);
    for (const band of bands){
      const k = `${date}|${band}|${lab}`;
      if (!out.has(k)) out.set(k, { date, band, lab, checkFreqs: new Set() });
      if (flag) out.get(k).checkFreqs.add(freq);   // 일반 행과 합쳐져도 표시는 유지
    }
  });
}

// SAR Lab. 정렬: 번호 오름차순(SAR 2 < SAR 4 < SAR 10). 번호 없는 값은 글자순, 빈 값은 맨 뒤.
function labCmp(a, b){
  if (!a || !b) return (!a) - (!b);
  const na = parseFloat((a.match(/\d+(\.\d+)?/) || [])[0]), nb = parseFloat((b.match(/\d+(\.\d+)?/) || [])[0]);
  if (isFinite(na) && isFinite(nb) && na !== nb) return na - nb;
  if (isFinite(na) !== isFinite(nb)) return isFinite(na) ? -1 : 1;
  return a.localeCompare(b, 'ko', { numeric: true });
}

let lastRows = [];

$('run').addEventListener('click', async () => {
  $('run').disabled = true;
  $('result').innerHTML = '';
  const found = new Map(), errors = [];
  for (const [i, f] of state.files.entries()){
    $('msg').textContent = `읽는 중… (${i + 1}/${state.files.length}) ${f.name}`;
    try{
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(await f.arrayBuffer());
      wb.eachSheet(ws => scanSheet(ws, found));
    }catch(e){
      errors.push(`${f.name}: 읽을 수 없어요 (${e.message})`);
    }
  }
  lastRows = [...found.values()].sort((a, b) =>
    labCmp(a.lab, b.lab) || a.date.localeCompare(b.date) || a.band - b.band);
  for (const r of lastRows)
    r.note = r.checkFreqs.size ? `확인 필요: ${[...r.checkFreqs].sort((x, y) => x - y).map(fmt2).join(', ')} MHz는 두 시스템의 정확히 가운데` : '';

  const checks = lastRows.filter(r => r.note).length;
  $('msg').innerHTML = `${state.files.length}개 파일에서 ${lastRows.length}건` +
    (checks ? ` · <span class="warn">확인 필요 ${checks}건</span>` : '') +
    errors.map(e => `<br><span class="warn">${esc(e)}</span>`).join('');
  renderResult();
  $('run').disabled = false;
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderResult(){
  if (!lastRows.length){
    $('result').innerHTML = '<p class="warn">System Check Date가 적힌 행을 찾지 못했어요.</p>';
    return;
  }
  $('result').innerHTML = `
    <div class="bar" style="margin:0 0 12px"><span class="grow"></span><button id="save" class="primary">엑셀로 저장</button></div>
    <div class="tbl"><table>
      <thead><tr><th>No.</th><th>System Check Date</th><th>대역 (MHz)</th><th>SAR Lab.</th><th>비고</th></tr></thead>
      <tbody>${lastRows.map((r, i) => `<tr class="${r.note ? 'chk' : ''}"><td>${i + 1}</td><td>${r.date}</td>
        <td>${fmt2(r.band)}${r.note ? ' ⚠' : ''}</td><td>${esc(r.lab)}</td><td class="nt">${esc(r.note)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  $('save').addEventListener('click', saveXlsx);
}

// 시트 이름: SAR Lab. 값에서 "SAR 숫자" 부분만 (예: "SAR 4 (2F)" → "SAR 4"). 없으면 Lab 값, 빈칸이면 "기타".
function sheetNameOf(lab){
  const m = String(lab).match(/SAR\s*\d+/i);
  const name = (m ? m[0] : String(lab)).replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31);
  return name || '기타';
}

async function saveXlsx(){
  const wb = new ExcelJS.Workbook();
  // Lab별 시트 (lastRows가 이미 Lab 번호순 → 시트도 같은 순서)
  const groups = new Map();
  for (const r of lastRows){
    const n = sheetNameOf(r.lab);
    if (!groups.has(n)) groups.set(n, []);
    groups.get(n).push(r);
  }
  for (const [name, rows] of groups) fillSheet(wb.addWorksheet(name), rows);
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  a.download = 'systemcheckdate.xlsx';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function fillSheet(ws, rows){
  ws.columns = [
    { header: 'No.', width: 6 },
    { header: 'System Check Date', width: 20 },
    { header: '대역 (MHz)', width: 14 },
    { header: 'SAR Lab.', width: 12 },
    { header: '비고', width: 44 },
  ];
  rows.forEach((r, i) => ws.addRow([i + 1, r.date, r.band, r.lab, r.note]));
  ws.getColumn(3).numFmt = '0.00';   // 대역은 숫자 그대로 두고 소수점 둘째 자리까지 표시
  const thin = { style: 'thin', color: { argb: 'FF808080' } };
  ws.eachRow((row, n) => row.eachCell(c => {
    c.border = { top: thin, left: thin, bottom: thin, right: thin };
    c.alignment = { horizontal: 'center', vertical: 'middle' };
    if (n === 1){
      c.font = { bold: true };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFC6D9F0' } };
    }
  }));
  // 확인 필요 행: 행 전체 노란색, 비고는 왼쪽 정렬
  rows.forEach((r, i) => {
    if (!r.note) return;
    const row = ws.getRow(i + 2);
    for (let c = 1; c <= 5; c++) row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
    row.getCell(5).alignment = { horizontal: 'left', vertical: 'middle' };
  });
  ws.views = [{ state: 'frozen', ySplit: 1 }];
}
</script>
</body>
</html>
